[project]
name = "cs2-round-analyzer-api"
version = "0.1.0"
description = "API locale pour analyser des demos CS2"
requires-python = ">=3.12"
dependencies = [
  "demoparser2>=0.42,<0.43",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a local .dem file supplied by CS2_ANALYZER_DEMO",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/cs2_analyzer/main.py" = ["B008"] # Signature recommandee par FastAPI pour UploadFile.

[tool.ruff.format]
quote-style = "double"
